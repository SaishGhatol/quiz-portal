    <script>
      // Apply the saved theme before first paint, otherwise dark users see a white flash
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
